name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version custom_components/grocery_tracker/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -r requirements_test.txt
          ruff check .
          pytest -q

      - name: Build zip
        run: |
          cd custom_components/grocery_tracker
          zip -r "${GITHUB_WORKSPACE}/grocery_tracker.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" grocery_tracker.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes
