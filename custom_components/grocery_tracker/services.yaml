import_receipt:
  fields:
    path:
      required: true
      example: "/config/grocery_tracker/ebon.pdf"
      selector:
        text:

list_products:
  fields:
    search:
      example: "MILCH"
      selector:
        text:
    category:
      selector:
        select:
          translation_key: category
          options:
            - fruit_vegetables
            - dairy_eggs
            - bakery
            - meat_fish
            - pantry
            - frozen
            - snacks_sweets
            - beverages
            - drugstore_household
            - deposit
            - other

set_category:
  fields:
    product:
      required: true
      example: "GEM PFAN TOSKANA"
      selector:
        text:
    category:
      required: true
      selector:
        select:
          translation_key: category
          options:
            - fruit_vegetables
            - dairy_eggs
            - bakery
            - meat_fish
            - pantry
            - frozen
            - snacks_sweets
            - beverages
            - drugstore_household
            - deposit
            - other

categorize_products:
  fields:
    entity_id:
      selector:
        entity:
          filter:
            domain: ai_task

check_mailboxes:
